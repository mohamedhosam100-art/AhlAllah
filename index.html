<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام متابعة الطلاب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4f7fb;--card:#ffffff;--text:#0f172a;--muted:#64748b;
  --accent:#1e40af;--accent-soft:rgba(30,64,175,.12);
  --success:#059669;--danger:#dc2626;--warning:#d97706;
  --border:rgba(15,23,42,.08)
}
*{font-family:"Cairo",sans-serif;box-sizing:border-box}
body{background:var(--bg);color:var(--text);margin:0}
.tab-btn.active{background:var(--accent);color:#fff}
.tab-btn{transition:all .2s ease}
.card{transition:transform .2s ease,box-shadow .2s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.08)}
.modal{display:none}.modal.show{display:flex}
input,select,textarea{font-family:"Cairo",sans-serif;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.pill{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block}
</style>
</head>
<body>
<div class="max-w-xl mx-auto px-4 pb-32">

  <div class="pt-6 pb-4">
    <div class="flex items-center gap-3 mb-2">
      <div style="width:48px;height:48px;border-radius:14px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent)">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
      </div>
      <div>
        <h1 class="text-xl font-extrabold">نظام متابعة الطلاب</h1>
        <p class="text-xs" style="color:var(--muted)">الإصدار الكامل · يعمل الآن</p>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-2 gap-3 mb-5">
    <div class="card rounded-2xl p-4" style="background:var(--card);border:1px solid var(--border)">
      <p class="text-xs mb-1" style="color:var(--muted)">إجمالي الطلاب</p>
      <p class="text-2xl font-extrabold" id="statStudents">0</p>
    </div>
    <div class="card rounded-2xl p-4" style="background:var(--card);border:1px solid var(--border)">
      <p class="text-xs mb-1" style="color:var(--muted)">نسبة الحضور</p>
      <p class="text-2xl font-extrabold" id="statAttend" style="color:var(--success)">0%</p>
    </div>
    <div class="card rounded-2xl p-4" style="background:var(--card);border:1px solid var(--border)">
      <p class="text-xs mb-1" style="color:var(--muted)">المحصل</p>
      <p class="text-2xl font-extrabold" id="statPaid">0</p>
    </div>
    <div class="card rounded-2xl p-4" style="background:var(--card);border:1px solid var(--border)">
      <p class="text-xs mb-1" style="color:var(--muted)">المتبقي</p>
      <p class="text-2xl font-extrabold" id="statRemain" style="color:var(--danger)">0</p>
    </div>
  </div>

  <div class="flex gap-1.5 mb-5 p-1 rounded-2xl overflow-x-auto" style="background:var(--card);border:1px solid var(--border)">
    <button class="tab-btn active flex-1 py-2.5 px-2 rounded-xl font-semibold text-xs whitespace-nowrap" data-tab="students">👥 الطلاب</button>
    <button class="tab-btn flex-1 py-2.5 px-2 rounded-xl font-semibold text-xs whitespace-nowrap" data-tab="attendance" style="color:var(--muted)">📅 الحضور</button>
    <button class="tab-btn flex-1 py-2.5 px-2 rounded-xl font-semibold text-xs whitespace-nowrap" data-tab="levels" style="color:var(--muted)">📝 المستوى</button>
    <button class="tab-btn flex-1 py-2.5 px-2 rounded-xl font-semibold text-xs whitespace-nowrap" data-tab="payments" style="color:var(--muted)">💰 المدفوعات</button>
    <button class="tab-btn flex-1 py-2.5 px-2 rounded-xl font-semibold text-xs whitespace-nowrap" data-tab="reports" style="color:var(--muted)">📊 تقارير</button>
  </div>

  <!-- الطلاب -->
  <div id="tab-students" class="tab-content">
    <button onclick="openModal('studentModal')" class="w-full py-3.5 rounded-2xl font-bold mb-4 text-white text-sm" style="background:var(--accent)">+ إضافة طالب جديد</button>
    <div id="studentsList" class="space-y-3"></div>
  </div>

  <!-- الحضور -->
  <div id="tab-attendance" class="tab-content hidden">
    <div class="card rounded-2xl p-4 mb-4" style="background:var(--card);border:1px solid var(--border)">
      <input type="date" id="attendanceDate" onchange="renderAttendance()" class="w-full p-3 rounded-xl border text-sm" style="border-color:var(--border)">
    </div>
    <button onclick="saveAttendance()" class="w-full py-3.5 rounded-2xl font-bold mb-4 text-white text-sm" style="background:var(--success)">✓ حفظ الحضور</button>
    <div id="attendanceList" class="space-y-2"></div>
  </div>

  <!-- المستوى -->
  <div id="tab-levels" class="tab-content hidden"><div id="levelsList" class="space-y-3"></div></div>

  <!-- المدفوعات -->
  <div id="tab-payments" class="tab-content hidden"><div id="paymentsList" class="space-y-3"></div></div>

  <!-- التقارير -->
  <div id="tab-reports" class="tab-content hidden">
    <div class="card rounded-2xl p-5 mb-4" style="background:var(--card);border:1px solid var(--border)">
      <h3 class="font-bold mb-3">📥 تصدير البيانات</h3>
      <div class="grid grid-cols-2 gap-2">
        <button onclick="exportExcel()" class="py-3 rounded-xl font-semibold text-sm text-white" style="background:#107c41">📊 Excel</button>
        <button onclick="exportBackup()" class="py-3 rounded-xl font-semibold text-sm text-white" style="background:#1e40af">💾 نسخة احتياطية</button>
      </div>
    </div>
    <div class="card rounded-2xl p-5" style="background:var(--card);border:1px solid var(--border)">
      <h3 class="font-bold mb-3">☁️ استعادة نسخة سابقة</h3>
      <input type="file" accept=".json" onchange="restoreBackup(event)" class="w-full text-sm">
    </div>
  </div>

  <!-- نافذة إضافة طالب -->
  <div id="studentModal" class="modal fixed inset-0 items-end justify-center" style="background:rgba(0,0,0,.5);z-index:50">
    <div class="w-full max-w-xl rounded-t-3xl p-6" style="background:var(--card)">
      <h3 class="text-lg font-bold mb-4">إضافة طالب جديد</h3>
      <div class="space-y-2.5">
        <input id="stName" placeholder="* اسم الطالب كاملاً" class="w-full p-3 rounded-xl border text-sm" style="border-color:var(--border)">
        <div class="grid grid-cols-2 gap-2">
          <select id="stClass" class="p-3 rounded-xl border text-sm" style="border-color:var(--border)">
            <option value="">الصف / المرحلة</option>
            <option>رياض أطفال</option><option>أول ابتدائي</option><option>ثاني ابتدائي</option>
            <option>ثالث ابتدائي</option><option>رابع ابتدائي</option><option>خامس ابتدائي</option>
            <option>سادس ابتدائي</option><option>إعدادي أول</option><option>إعدادي ثاني</option>
            <option>إعدادي ثالث</option><option>ثانوي عام</option><option>حلقة تحفيظ قرآن</option>
          </select>
          <input id="stFees" type="number" placeholder="* الرسوم الشهرية" class="p-3 rounded-xl border text-sm" style="border-color:var(--border)">
        </div>
        <input id="stParent" placeholder="رقم هاتف ولي الأمر" class="w-full p-3 rounded-xl border text-sm" style="border-color:var(--border)">
        <input id="stJoin" type="date" class="w-full p-3 rounded-xl border text-sm" style="border-color:var(--border)">
      </div>
      <div class="grid grid-cols-2 gap-3 mt-5">
        <button onclick="closeModal('studentModal')" class="py-3 rounded-xl font-semibold text-sm" style="border:1px solid var(--border);color:var(--muted)">إلغاء</button>
        <button onclick="addStudent()" class="py-3 rounded-xl font-bold text-sm text-white" style="background:var(--accent)">حفظ الطالب</button>
      </div>
    </div>
  </div>

  <!-- نافذة تقييم -->
  <div id="markModal" class="modal fixed inset-0 items-end justify-center" style="background:rgba(0,0,0,.5);z-index:50">
    <div class="w-full max-w-xl rounded-t-3xl p-6" style="background:var(--card)">
      <h3 class="text-lg font-bold mb-4" id="markStudentName">إضافة تقييم مستوى</h3>
      <input type="hidden" id="markStudentId">
      <div class="space-y-2.5">
        <input id="markSubject" placeholder="المادة / الجزء / الاختبار" class="w-full p-3 rounded-xl border text-sm" style="border-color:var(--border)">
        <div class="grid grid-cols-2 gap-2">
          <input id="markValue" type="number" placeholder="الدرجة" class="p-3 rounded-xl border text-sm" style="border-color:var(--border)">
          <input id="markMax" type="number" value="100" class="p-3 rounded-xl border text-sm" style="border-color:var(--border)">
        </div>
        <input id="markDate" type="date" class="w-full p-3 rounded-xl border text-sm" style="border-color:var(--border)">
        <textarea id="markNote" placeholder="ملاحظات المعلم" rows="2" class="w-full p-3 rounded-xl border text-sm" style="border-color:var(--border)"></textarea>
      </div>
      <div class="grid grid-cols-2 gap-3 mt-5">
        <button onclick="closeModal('markModal')" class="py-3 rounded-xl font-semibold text-sm" style="border:1px solid var(--border);color:var(--muted)">إلغاء</button>
        <button onclick="addMark()" class="py-3 rounded-xl font-bold text-sm text-white" style="background:var(--accent)">حفظ التقييم</button>
      </div>
    </div>
  </div>

  <!-- نافذة دفعة -->
  <div id="payModal" class="modal fixed inset-0 items-end justify-center" style="background:rgba(0,0,0,.5);z-index:50">
    <div class="w-full max-w-xl rounded-t-3xl p-6" style="background:var(--card)">
      <h3 class="text-lg font-bold mb-4" id="payStudentName">تسجيل دفعة مالية</h3>
      <input type="hidden" id="payStudentId">
      <div class="space-y-2.5">
        <input id="payAmount" type="number" placeholder="* قيمة الدفعة" class="w-full p-3 rounded-xl border text-sm" style="border-color:var(--border)">
        <input id="payDate" type="date" class="w-full p-3 rounded-xl border text-sm" style="border-color:var(--border)">
        <textarea id="payNote" placeholder="ملاحظات (اختياري)" rows="2" class="w-full p-3 rounded-xl border text-sm" style="border-color:var(--border)"></textarea>
      </div>
      <div class="grid grid-cols-2 gap-3 mt-5">
        <button onclick="closeModal('payModal')" class="py-3 rounded-xl font-semibold text-sm" style="border:1px solid var(--border);color:var(--muted)">إلغاء</button>
        <button onclick="addPayment()" class="py-3 rounded-xl font-bold text-sm text-white" style="background:var(--success)">تأكيد الدفع</button>
      </div>
    </div>
  </div>

</div>

<script>
// ===== قاعدة البيانات المحلية (تعمل فوراً) =====
let DB = JSON.parse(localStorage.getItem('schoolDB_v1') || '{"students":[],"attendance":{},"marks":[],"payments":[]}');
function saveDB(){ localStorage.setItem('schoolDB_v1', JSON.stringify(DB)); renderAll(); }

// ===== التنقل بين التبويبات =====
document.querySelectorAll('.tab-btn').forEach(b=>{
  b.onclick = function(){
    document.querySelectorAll('.tab-btn').forEach(x=>{x.classList.remove('active');x.style.color='var(--muted)'});
    this.classList.add('active'); this.style.color='';
    document.querySelectorAll('.tab-content').forEach(c=>c.classList.add('hidden'));
    document.getElementById('tab-'+this.dataset.tab).classList.remove('hidden');
  }
});

function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
function today(){ return new Date().toISOString().slice(0,10); }

// ===== إضافة وحذف طالب =====
function addStudent(){
  const name = document.getElementById('stName').value.trim();
  const fees = Number(document.getElementById('stFees').value) || 0;
  if(!name){ alert('من فضلك أدخل اسم الطالب'); return; }
  DB.students.push({
    id: Date.now(),
    name,
    class: document.getElementById('stClass').value,
    parent: document.getElementById('stParent').value,
    fees,
    join: document.getElementById('stJoin').value || today()
  });
  ['stName','stClass','stParent','stFees','stJoin'].forEach(i=>document.getElementById(i).value='');
  closeModal('studentModal');
  saveDB();
}
function deleteStudent(id){
  if(!confirm('حذف الطالب نهائياً وكل بياناته؟')) return;
  DB.students = DB.students.filter(s=>s.id!==id);
  Object.keys(DB.attendance).forEach(d=>delete DB.attendance[d][id]);
  DB.marks = DB.marks.filter(m=>m.studentId!==id);
  DB.payments = DB.payments.filter(p=>p.studentId!==id);
  saveDB();
}

// ===== فتح نوافذ التقييم والدفعة =====
function openMark(id,name){
  document.getElementById('markStudentId').value=id;
  document.getElementById('markStudentName').textContent='تقييم: '+name;
  document.getElementById('markDate').value=today();
  ['markSubject','markValue','markMax','markNote'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('markMax').value=100;
  openModal('markModal');
}
function openPay(id,name){
  document.getElementById('payStudentId').value=id;
  document.getElementById('payStudentName').textContent='دفعة لـ: '+name;
  document.getElementById('payDate').value=today();
  ['payAmount','payNote'].forEach(i=>document.getElementById(i).value='');
  openModal('payModal');
}
function addMark(){
  const sid = Number(document.getElementById('markStudent
